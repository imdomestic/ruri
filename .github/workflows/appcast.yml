name: Appcast

# Publishing, editing or withdrawing a release rebuilds the Sparkle feeds from
# the published releases. Drafts are never listed. Each run force-pushes a
# single fresh commit to gh-pages, which GitHub Pages serves: Actions-based
# Pages deployments are keyed by commit, so redeploying a tag that points at an
# already deployed commit would keep serving the old feed.
on:
  release:
    types: [published, edited, unpublished, deleted]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appcast
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'guh0613/ruri'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Release events check out the tag; the generator on main handles older tags too.
          ref: main
          persist-credentials: false
      - name: Generate appcast
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/sparkle-update.py appcast --output build/appcast
      - name: Push to gh-pages
        working-directory: build/appcast
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Update appcast ($GITHUB_EVENT_NAME)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
