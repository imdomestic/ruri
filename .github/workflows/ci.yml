name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.repository == 'guh0613/ruri'
    name: Test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        # Both slices build with one Xcode on Apple silicon; Intel builds are
        # cross-compiled and their tests run under Rosetta. An older Intel
        # toolchain only added compiler crashes of its own.
        include:
          - arch: arm64
            cross_arch: ''
          - arch: x86_64
            cross_arch: x86_64
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      RURI_ARCH: ${{ matrix.cross_arch }}
      RURI_BUILD_DIR: .build/ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
      - name: Check build configuration
        run: python3 -m unittest discover -s scripts/tests
      - name: Build all products
        run: scripts/swift-build.sh --force-resolved-versions
      - name: Test
        # Process/timeout fixtures need prompt scheduling on shared runners.
        run: scripts/swift-build.sh test --no-parallel --force-resolved-versions
      - name: Verify packaged CLI
        run: scripts/build-app.sh debug --force-resolved-versions
