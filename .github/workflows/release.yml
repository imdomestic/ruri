name: Release

on:
  push:
    tags: ['v*']
  # Manual runs produce preview artifacts only. Push a version tag to draft a release.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    if: github.repository == 'guh0613/ruri'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            RURI_VERSION="${GITHUB_REF_NAME#v}"
          else
            base="$(python3 -c 'import plistlib; print(plistlib.load(open("Resources/Info.plist", "rb"))["CFBundleShortVersionString"])')"
            RURI_VERSION="$base-dev.$GITHUB_RUN_NUMBER.g${GITHUB_SHA:0:7}"
          fi
          export RURI_VERSION
          mkdir -p build
          cp Resources/Info.plist build/Info.plist
          python3 scripts/lib/app.py metadata build/Info.plist
          echo "version=$RURI_VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$RURI_VERSION" == *-* ]]; then
            echo 'prerelease=true' >> "$GITHUB_OUTPUT"
          else
            echo 'prerelease=false' >> "$GITHUB_OUTPUT"
          fi

  package:
    name: Package (${{ matrix.arch }})
    needs: metadata
    if: github.repository == 'guh0613/ruri' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    environment: release-signing
    strategy:
      fail-fast: false
      matrix:
        # Both slices build with the Xcode that CI tests; the Intel package is
        # cross-compiled on Apple silicon.
        include:
          - arch: arm64
            cross_arch: ''
          - arch: x86_64
            cross_arch: x86_64
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      RURI_ARCH: ${{ matrix.cross_arch }}
      RURI_BUILD_DIR: .build/ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require source from main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
      # CI builds and tests this commit on the same runners; the draft waits for it.
      - name: Build DMG
        env:
          RURI_VERSION: ${{ needs.metadata.outputs.version }}
          RURI_BUILD_NUMBER: ${{ github.run_number }}
          # Optional public application ID override; otherwise use Resources/Info.plist.
          RURI_MICROSOFT_CLIENT_ID: ${{ vars.RURI_MICROSOFT_CLIENT_ID }}
          RURI_CURSEFORGE_API_KEY: ${{ secrets.RURI_CURSEFORGE_API_KEY }}
          RURI_REQUIRE_SIGNING: '1'
          RURI_SIGN_P12_BASE64: ${{ secrets.RURI_APPLE_SIGN_P12_BASE64 }}
          RURI_SIGN_P12_PASSWORD: ${{ secrets.RURI_APPLE_SIGN_P12_PASSWORD }}
        run: scripts/package-dmg.sh
      - name: Sign update for Sparkle
        env:
          RURI_SPARKLE_PRIVATE_KEY: ${{ secrets.RURI_SPARKLE_PRIVATE_KEY }}
        run: python3 scripts/release/sparkle-update.py sign build/Ruri.app build/dmg/*.dmg
      - name: Clean up signing keychain
        if: always()
        run: python3 scripts/release/signing.py cleanup-ci
      - name: Upload DMG and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Ruri-${{ needs.metadata.outputs.version }}-macOS-${{ matrix.arch }}
          path: |
            build/dmg/*.dmg
            build/dmg/*.sha256
            build/dmg/*.sparkle.json
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 14

  publish:
    name: Draft release
    if: github.repository == 'guh0613/ruri' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [metadata, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
      PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require CI success
        shell: bash
        run: |
          # Pushing the tagged commit to main runs CI; a manual CI run on the tag also counts.
          run_id=
          for _ in $(seq 30); do
            run_id="$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            [[ -n "$run_id" ]] && break
            sleep 10
          done
          if [[ -z "$run_id" ]]; then
            echo "No CI run found for $GITHUB_SHA. Run: gh workflow run ci.yml --ref $RELEASE_TAG" >&2
            exit 1
          fi
          until [[ "$(gh run view "$run_id" --json status --jq .status)" == completed ]]; do sleep 30; done
          conclusion="$(gh run view "$run_id" --json conclusion --jq .conclusion)"
          if [[ "$conclusion" != success ]]; then
            echo "CI run $run_id concluded $conclusion; rerun it, then rerun this job." >&2
            exit 1
          fi
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: Ruri-${{ needs.metadata.outputs.version }}-macOS-*
          merge-multiple: true
          path: artifacts
      - name: Verify both architectures
        working-directory: artifacts
        run: |
          for arch in arm64 x86_64; do
            sha256sum --check "Ruri-$RELEASE_VERSION-macOS-$arch.dmg.sha256"
          done
      - name: Create release draft
        shell: bash
        run: |
          # Direct commits are included even when there are no merged PRs.
          previous_tag="$(git describe --tags --match 'v[0-9]*' --abbrev=0 "$RELEASE_TAG^" 2>/dev/null || true)"
          if [[ -n "$previous_tag" ]]; then
            range="$previous_tag..$RELEASE_TAG"
          else
            range="$RELEASE_TAG"
          fi
          git log --no-merges --format='- %s (%h)' "$range" > "$RUNNER_TEMP/release-notes.md"
          # Leave the release as a draft for the owner to edit and publish.
          # Reruns preserve edited notes and never replace a published binary.
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > "$RUNNER_TEMP/is-draft"; then
            if [[ "$(cat "$RUNNER_TEMP/is-draft")" != true ]]; then
              echo 'This release is already published; create a new version tag to change its binaries.' >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" artifacts/* --clobber
          else
            gh release create "$RELEASE_TAG" artifacts/* --verify-tag --draft \
              --title "Ruri $RELEASE_VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease="$PRERELEASE"
          fi
